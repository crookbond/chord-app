# ADR 0335 - OAuth discovery for the MCP connector (Claude, ChatGPT). Clients
# look for these at the site root, which the SPA fallback would otherwise
# answer with index.html. Included in every server block of the chord site
# (deploy.sh adds the include); rewritten on every deploy. The rest of the
# connector lives under /api/ and needs nothing here.
location ~ ^/\.well-known/oauth-(authorization-server|protected-resource)(/.*)?$ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
