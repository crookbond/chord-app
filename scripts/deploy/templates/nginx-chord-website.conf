# Public website (docs/ops/website.md) - included after `root` in the block
# that serves the web build; rewritten every deploy. The pages are generated
# into mobile/public by scripts/site/build.mjs and copied into the web build
# by `expo export`. No add_header here: one in a location would drop the HSTS
# header the security snippet adds at server level.

# "/" is the static home page or the app; see chord-website-map.conf.
location = / {
    try_files $chord_home =404;
}

# Site pages: /pricing serves pricing/index.html. A page that does not exist
# is a real 404, not the app's shell, so crawlers do not index empty pages.
location ~ ^/(email-reader|features|for|compare|pricing|security|faq|how-to|changelog|download)(/|$) {
    try_files $uri $uri/index.html =404;
}

# The Markdown copy of each page, for AI tools (llms.txt links them).
location ~ ^/[a-z0-9/-]+\.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
}

location ~ ^/(llms|llms-full|robots)\.txt$ {
    charset utf-8;
    try_files $uri =404;
}

location = /sitemap.xml {
    try_files $uri =404;
}
