# ADR 0269 - included in every server block of the chord site (deploy.sh adds
# the include to a site certbot already edited). Rewritten on every deploy.

# HTTPS only, for a year, subdomains too. Sent on the 443 block certbot added;
# browsers ignore it over plain HTTP, so the redirect block carrying it is
# harmless. `always` adds it to error responses as well.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Node (helmet) sets its own on /api responses; drop that copy so a response
# carries one header, not two.
proxy_hide_header Strict-Transport-Security;

# One web origin. A browser keeps its sign-in per origin, so a user who
# started on www and was sent back to the bare domain (Apple, Stripe and
# OpenRouter all return to WEB_ORIGIN) arrived signed out. The alias hosts and
# the canonical one come from conf.d/chord-canonical.conf, generated by
# deploy.sh. Only pages move: /.well-known/ stays so certificate renewal and
# the app association files answer on every host, and /api/ stays because a
# 301 turns a POST into a GET (TWILIO_PUBLIC_URL points webhooks at www).
set $chord_to_canonical $chord_alias_host;
# $request_uri, not $uri: a missing file falls back to /index.html, and that
# internal redirect runs this check again with $uri already rewritten.
if ($request_uri ~ "^/(\.well-known|api)/") {
    set $chord_to_canonical 0;
}
if ($chord_to_canonical) {
    return 301 https://$chord_canonical_host$request_uri;
}

# The query string can carry credentials (the web app's SSE ?token=, the image
# proxy's ?k=, OAuth code/state), so the access log records the path only.
access_log /var/log/nginx/access.log chord_noquery;
