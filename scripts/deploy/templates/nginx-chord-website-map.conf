# Public website (docs/ops/website.md) - http context, rewritten every deploy.
# What "/" serves. A visitor with a session cookie (ADR 0316, `chord.sid`), or
# any query string (sign-in returns, "/?app=1", "/?signin=1"), gets the app;
# everyone else - including search engines and AI crawlers, which run no
# JavaScript - gets the static home page.
map $http_cookie $chord_has_session {
    default 0;
    "~(^|;\s*)chord\.sid=" 1;
}
map "$args:$chord_has_session" $chord_home {
    default /index.html;
    ":0"    /home.html;
}
