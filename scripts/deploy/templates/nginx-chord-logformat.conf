# ADR 0269 - http-level log format for the chord site: the combined format with
# the request path ($uri) in place of the request line, so no query string and
# no Referer (which can hold one too) is written to disk.
log_format chord_noquery '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_user_agent"';
