<svg viewBox="0 0 940 740" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">WhatsApp cold-inbound onboarding sequence</title>
  <desc id="d">A stranger messages the WhatsApp number; the server replies with a signup link carrying a referrer token but creates no account. The user signs in with Google; the server creates a real account and consumes the token to link the verified phone to the verified email. From the next message on, the thread binds to the user's personal group and the bot replies, visible in the app.</desc>

  <rect x="0" y="0" width="940" height="740" fill="#ffffff"/>

  <style>
    .life { stroke:#cbd5e1; stroke-width:1.4; stroke-dasharray:4 5; }
    .msg  { stroke:#374151; stroke-width:1.7; }
    .ret  { stroke:#6b7280; stroke-width:1.5; stroke-dasharray:6 4; }
    .lbl  { font-size:11px; fill:#1f2937; }
    .note { font-size:11px; fill:#475569; font-style:italic; }
    .box  { fill:#ffffff; stroke:#2563eb; stroke-width:1.3; }
    .boxt { font-size:10.5px; fill:#1e3a8a; font-weight:600; }
    .hdr  { font-size:12.5px; font-weight:700; }
  </style>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker>
  </defs>

  <!-- phase bands -->
  <rect x="10" y="76"  width="920" height="250" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="10" y="336" width="920" height="230" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="10" y="576" width="920" height="150" rx="10" fill="#fefce8" stroke="#fde68a"/>

  <!-- phase pills -->
  <rect x="16" y="82"  width="226" height="20" rx="10" fill="#15803d"/><text x="24" y="96"  font-size="11.5" font-weight="700" fill="#fff">Phase 1 — Stranger messages</text>
  <rect x="16" y="342" width="232" height="20" rx="10" fill="#2563eb"/><text x="24" y="356" font-size="11.5" font-weight="700" fill="#fff">Phase 2 — Signs up with Google</text>
  <rect x="16" y="582" width="240" height="20" rx="10" fill="#b45309"/><text x="24" y="596" font-size="11.5" font-weight="700" fill="#fff">Phase 3 — Linked, now it works</text>

  <!-- lifelines -->
  <g class="life">
    <line x1="90"  y1="58" x2="90"  y2="722"/>
    <line x1="280" y1="58" x2="280" y2="722"/>
    <line x1="470" y1="58" x2="470" y2="722"/>
    <line x1="660" y1="58" x2="660" y2="722"/>
    <line x1="850" y1="58" x2="850" y2="722"/>
  </g>

  <!-- actor headers -->
  <g text-anchor="middle">
    <rect x="25"  y="18" width="130" height="40" rx="8" fill="#dcfce7" stroke="#15803d"/><text class="hdr" x="90"  y="43" fill="#14532d">📱 User</text>
    <rect x="215" y="18" width="130" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/><text class="hdr" x="280" y="43" fill="#7f1d1d">☁️ Twilio</text>
    <rect x="405" y="18" width="130" height="40" rx="8" fill="#eff6ff" stroke="#2563eb"/><text class="hdr" x="470" y="43" fill="#1e3a8a">⚙️ Chord server</text>
    <rect x="595" y="18" width="130" height="40" rx="8" fill="#f1f5f9" stroke="#475569"/><text class="hdr" x="660" y="43" fill="#334155">🗄️ Postgres</text>
    <rect x="785" y="18" width="130" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/><text class="hdr" x="850" y="43" fill="#78350f">🔐 Google</text>
  </g>

  <!-- ============ Phase 1 ============ -->
  <g text-anchor="middle">
    <line class="msg" x1="90"  y1="118" x2="276" y2="118" marker-end="url(#ah)"/><text class="lbl" x="183" y="112">messages “hi”</text>
    <line class="msg" x1="280" y1="146" x2="466" y2="146" marker-end="url(#ah)"/><text class="lbl" x="375" y="140">POST /webhooks/whatsapp</text>

    <rect class="box" x="388" y="160" width="164" height="24" rx="6"/><text class="boxt" x="470" y="176">verify signature · parse</text>

    <line class="msg" x1="470" y1="208" x2="656" y2="208" marker-end="url(#ah)"/><text class="lbl" x="565" y="202">lookup → no binding, no account</text>
    <line class="msg" x1="470" y1="236" x2="656" y2="236" marker-end="url(#ah)"/><text class="lbl" x="565" y="230">mint signup token → phone</text>
    <line class="msg" x1="470" y1="264" x2="284" y2="264" marker-end="url(#ah)"/><text class="lbl" x="375" y="258">send welcome + …?ref=token</text>
    <line class="ret" x1="280" y1="290" x2="94"  y2="290" marker-end="url(#ahg)"/><text class="lbl" x="187" y="284">welcome + “Sign up” button</text>

    <rect x="60" y="300" width="300" height="18" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><text class="note" x="210" y="313">No account yet · nothing persisted</text>
  </g>

  <!-- ============ Phase 2 ============ -->
  <g text-anchor="middle">
    <line class="msg" x1="90"  y1="378" x2="846" y2="378" marker-end="url(#ah)"/><text class="lbl" x="470" y="372">taps link → Google sign-in</text>
    <line class="ret" x1="850" y1="406" x2="94"  y2="406" marker-end="url(#ahg)"/><text class="lbl" x="470" y="400">auth code</text>
    <line class="msg" x1="90"  y1="434" x2="466" y2="434" marker-end="url(#ah)"/><text class="lbl" x="278" y="428">POST /auth/google { code, ref }</text>
    <line class="msg" x1="470" y1="462" x2="846" y2="462" marker-end="url(#ah)"/><text class="lbl" x="660" y="456">exchange code → verified email</text>
    <line class="msg" x1="470" y1="490" x2="656" y2="490" marker-end="url(#ah)"/><text class="lbl" x="565" y="484">create real user + personal group</text>
    <line class="msg" x1="470" y1="518" x2="656" y2="518" marker-end="url(#ah)"/><text class="lbl" x="565" y="512">consume token → link phone → user</text>

    <rect x="250" y="530" width="372" height="18" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/><text class="note" x="436" y="543" fill="#047857">✅ phone ↔ email linked — both sides verified</text>
  </g>

  <!-- ============ Phase 3 ============ -->
  <g text-anchor="middle">
    <line class="msg" x1="90"  y1="618" x2="466" y2="618" marker-end="url(#ah)"/><text class="lbl" x="278" y="612">next WhatsApp message (via Twilio)</text>

    <rect class="box" x="300" y="632" width="340" height="24" rx="6"/><text class="boxt" x="470" y="648">paired → bind personal group · post · bot turn</text>

    <line class="ret" x1="470" y1="682" x2="94"  y2="682" marker-end="url(#ahg)"/><text class="lbl" x="282" y="676">bot reply (via Twilio)</text>

    <rect x="90" y="694" width="320" height="18" rx="9" fill="#fefce8" stroke="#fde68a"/><text class="note" x="250" y="707" fill="#92400e">✅ also appears in the Chord app (personal space)</text>
  </g>
</svg>
